[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-llm-agent"
version = "0.1.0"
description = "Conversational CRM analytics agent powered by OpenAI function calling"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# La racine du dépôt doit être sur sys.path pour que les tests importent
# analytics, core, tools et eval. Sans cette ligne, `python -m pytest` passe —
# il ajoute le répertoire courant de lui-même — mais `pytest` tout court échoue
# à la collecte. C'est la seconde forme qu'utilisent l'intégration continue et
# la plupart des contributeurs.
pythonpath = ["."]
