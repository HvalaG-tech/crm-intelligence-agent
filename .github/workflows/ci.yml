name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # Le fichier de questions est vérifié sans appeler le modèle : un outil
      # renommé sans mise à jour casserait l'évaluation en silence, et on ne
      # s'en apercevrait qu'au moment de produire le chiffre du README.
      - name: Valider la suite d'évaluation
        run: python -m eval.run_eval --dry-run
